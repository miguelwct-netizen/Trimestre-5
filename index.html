<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <a href="registrar.html" registrar></a>

    <link rel="icon" href="assets/img/image.png" type="image/x-icon" />
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="/assets/css/Style.css" />
    <title>Login</title>
  </head>

  <body>
    <!-- preloader -->
    <div class="preloader" id="preloader">
      <div class="spinner">Cargando...</div>
    </div>
    <!--Header-->
    <header>
      <h1>Login</h1>
      <button class="toggle-button" id="toggle-button">☰</button>
      <nav>
        <ul class="nav-links">
          <li><a href="registrar.html">Registrar</a></li>
          <!-- <li><a href="index.html">Home</a></li> -->
          <li>
            <a href="solicitar_recuperacion.html"
              >Solicitar Recuperacion Contraseña</a
            >
          </li>
        </ul>
      </nav>
    </header>
    <div class="login-container">
      <form id="login-form" action="/login" method="POST">
        <h1>Login</h1>
        <div class="validation-message" id="message-from-server">
          <p></p>
        </div>

        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required />
        </div>
        <div class="form-group">
          <label for="username"></label>
          <input
            type="password"
            id="password"
            data-type="password"
            name="password"
            pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[#?!@$%^&*\-]).{8,}$"
            title="Mínimo 8 caracteres, una mayúscula, una minúscula, un número y un carácter especial"
            required
          />
        </div>
        <div class="form-group checkbox-group">
          <input type="checkbox" id="show-password" name="show-password" />
          <label for="show-password">Show Password</label>
        </div>

        <button type="submit">Login</button>
      </form>
    </div>
    <footer>
      <p>&copy; 2024 My Website. All rights reserved.</p>
    </footer>

    <script src="/assets/js/main.js"></script>
  </body>
</html>
